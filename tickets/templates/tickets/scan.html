{% extends "users/base.html" %}

{% block title %}Escanear ticket | Ágora Ticket{% endblock %}

{% block content %}
  <h1>Escanear ticket</h1>
  {% csrf_token %}
  <label for="expected-event">Evento que atiendo</label>
  <select id="expected-event">
    <option value="">Selecciona un evento</option>
    {% for event in events %}
      <option value="{{ event.id }}">{{ event.name }}</option>
    {% endfor %}
  </select>

  <div id="qr-reader" aria-label="Cámara para escanear códigos QR"></div>
  <div id="scan-result" role="status" aria-live="polite"></div>
  <style>
    #scan-result[data-result="success"] { color: green; }
    #scan-result[data-result="error"],
    #scan-result[data-result="scan-error"] { color: darkred; }
    #scan-result[data-result="pending"] { color: darkorange; }
  </style>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script>
    window.addEventListener("load", function () {
      const result = document.getElementById("scan-result");
      const eventSelect = document.getElementById("expected-event");
      const csrfCookie = document.cookie.split("; ").find(function (row) {
        return row.startsWith("csrftoken=");
      });
      const csrfToken = csrfCookie ? decodeURIComponent(csrfCookie.split("=")[1]) : "";

      function showResult(kind, message) {
        result.dataset.result = kind;
        result.textContent = message;
      }

      if (location.protocol !== "https:" && location.hostname !== "localhost" &&
          location.hostname !== "127.0.0.1") {
        showResult("error", "La cámara requiere una conexión HTTPS.");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showResult("error", "Este dispositivo no tiene una cámara compatible.");
        return;
      }
      if (!window.Html5QrcodeScanner) {
        showResult("error", "No se pudo cargar el lector de códigos QR.");
        return;
      }

      navigator.mediaDevices.getUserMedia({video: true})
        .then(function (stream) {
          stream.getTracks().forEach(function (track) { track.stop(); });
          const scanner = new Html5QrcodeScanner("qr-reader", {
            fps: 10,
            qrbox: {width: 250, height: 250}
          }, false);
          scanner.render(function (decodedText) {
            scanner.clear().catch(function () {});
            showResult("pending", "Validando ticket...");
            fetch("{% url 'tickets:validate' %}", {
              method: "POST",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
              },
              body: JSON.stringify({
                token: decodedText,
                expected_event_id: eventSelect.value || null
              })
            })
              .then(function (response) {
                return response.json().then(function (data) {
                  return {status: response.status, data: data};
                });
              })
              .then(function (response) {
                const data = response.data;
                showResult(
                  response.status === 200 ? "success" : "error",
                  data.message || (data.result === "VALID"
                    ? "Ticket válido"
                    : "No se pudo validar el ticket")
                );
              })
              .catch(function () {
                showResult("error", "No se pudo contactar al servidor.");
              });
          }, function () {
            showResult("scan-error", "No se pudo leer el código QR.");
          });
        })
        .catch(function () {
          showResult("error", "No se concedió permiso para usar la cámara.");
        });
    });
  </script>
{% endblock %}
