<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ágora Ticket{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8f6f3; color: #202735; margin: 0; line-height: 1.6; }
    header { min-height: 84px; padding: 20px 36px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7ed; background: #fff; }
    header strong { font-size: 19px; letter-spacing: -.6px; }
    nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
    nav a { color: #525b6c; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; }
    nav a:hover, nav a[aria-current="page"] { background: #f6eae7; color: #803b38; }
    nav a:last-child { border: 1px solid #e4d4cd; }
    main { max-width: 560px; margin: 48px auto; padding: 36px; background: white; border: 1px solid #e5e7ed; border-radius: 16px; box-shadow: 0 8px 30px #20273505; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 5vw, 30px); line-height: 1.25; letter-spacing: -.9px; }
    p { margin: 0 0 20px; color: #596273; font-size: 14px; }
    a { color: #883e3b; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    a:hover { color: #652c2a; }
    main > form { margin: 28px 0 24px; }
    main > p:last-child { margin-bottom: 0; }
    .field { margin-bottom: 4px; }
    .field-feedback { height: 20px; overflow-y: auto; font-size: 12px; line-height: 1.5; }
    .field-feedback .errorlist { margin-top: 1px; font-size: 12px; }
    .field-feedback.has-help { display: grid; height: auto; min-height: 20px; overflow: visible; }
    .field-feedback.has-help > * { grid-area: 1 / 1; align-self: start; }
    .field-feedback.has-help.has-error > .helptext { visibility: hidden; }
    .password-field { position: relative; }
    .password-field input { padding-right: 52px; }
    .password-toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); padding: 0; width: 38px; min-height: 36px; background: transparent; color: #667085; border: 0; }
    .password-toggle:hover { background: #f6eae7; color: #803b38; }
    .password-toggle[hidden], .eye-slash[hidden] { display: none; }
    .birth-date { border: 0; padding: 0; margin: 0; min-width: 0; }
    .birth-date legend { padding: 0; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
    .date-selects { display: grid; grid-template-columns: .85fr 1.3fr 1fr; gap: 10px; }
    .date-selects select { min-width: 0; }
    .date-picker { position: relative; min-width: 0; }
    .date-native { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; opacity: 0; pointer-events: none; }
    .date-trigger { width: 100%; justify-content: space-between; min-height: 46px; padding: 10px 13px; background: white; color: #202735; border: 1px solid #cdd2dc; font-weight: 400; font-size: 15px; }
    .date-trigger::after { content: ''; width: 7px; height: 7px; border-right: 1.5px solid #667085; border-bottom: 1.5px solid #667085; transform: rotate(45deg); margin: -4px 0 0 10px; }
    .date-trigger:hover { background: #faf7f5; color: #202735; border-color: #a65c52; }
    .date-trigger[aria-expanded="true"] { border-color: #a65c52; box-shadow: 0 0 0 3px #883e3b1a; }
    .date-trigger.placeholder { color: #667085; }
    .date-trigger[aria-invalid="true"] { border-color: #bf4141; background: #fffafa; }
    .date-options { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10; max-height: 220px; overflow-y: auto; padding: 5px; background: white; border: 1px solid #e4d4cd; border-radius: 10px; box-shadow: 0 8px 24px #36252218; scrollbar-width: thin; scrollbar-color: #d6bdb3 transparent; }
    .date-option { display: block; width: 100%; min-height: 36px; padding: 7px 10px; text-align: left; background: white; color: #414957; border: 0; border-radius: 5px; font-size: 14px; font-weight: 400; }
    .date-option:hover, .date-option:focus { background: #f6eae7; color: #803b38; outline: none; }
    .date-option[aria-selected="true"] { background: #883e3b; color: white; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
    .required { color: #b33131; margin-left: 3px; }
    input, select { width: 100%; min-height: 46px; padding: 10px 13px; border: 1px solid #cdd2dc; border-radius: 8px; background: #fff; color: #202735; font: inherit; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
    input:hover, select:hover { border-color: #929aaa; }
    input:focus, select:focus { outline: none; border-color: #a65c52; box-shadow: 0 0 0 3px #883e3b1a; }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: #bf4141; background: #fffafa; }
    button, .button { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 11px 20px; background: #883e3b; color: white; border: 1px solid transparent; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background .15s; }
    button:hover, .button:hover { background: #70312f; color: white; }
    main > form > button { width: 100%; }
    nav button { min-height: 38px; padding: 7px 13px; background: white; color: #525b6c; border-color: #dce0e8; font-weight: 500; }
    nav button:hover { background: #f1f2f6; color: #202735; }
    .helptext { display: block; margin-top: 6px; font-size: 12px; color: #667085; line-height: 1.6; }
    .helptext:empty { display: none; }
    .helptext ul { padding-left: 18px; margin: 5px 0 0; }
    .limit-notice { color: #885314; }
    .errorlist { list-style: none; padding: 0; margin: 6px 0 0; color: #ac2929; font-size: 13px; }
    .alert { padding: 12px 15px; border: 1px solid #dce3ed; border-radius: 8px; background: #f2f5fa; color: #3f5675; font-size: 14px; margin-bottom: 22px; }
    .alert p { margin: 0; color: inherit; }
    .alert.error { background: #fff3f3; border-color: #f0cece; color: #a12828; }
    .alert.success { background: #edf8f1; border-color: #cae6d3; color: #24633c; }
    .alert.warning { background: #fff8e9; border-color: #efdfb7; color: #805614; }
    .alert .errorlist { margin: 0; color: inherit; }
    dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); margin: 24px 0; font-size: 14px; }
    dt, dd { margin: 0; padding: 10px 0; border-bottom: 1px solid #eceef3; overflow-wrap: anywhere; }
    dt { color: #667085; } dd { font-weight: 500; }
    :focus-visible { outline: 3px solid #b77763; outline-offset: 3px; }
    @media (max-width: 600px) { header { padding: 16px; gap: 12px; } nav { gap: 2px; } nav a { padding: 7px 9px; } main { margin: 24px 16px; padding: 26px 22px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <strong>Ágora Ticket</strong>
    <nav aria-label="Navegación de cuentas">
      {% if user.is_authenticated %}
        <a href="{% url 'users:dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>Mi panel</a>
        <a href="{% url 'users:profile' %}" {% if request.resolver_match.url_name == 'profile' %}aria-current="page"{% endif %}>Mi perfil</a>
        <form method="post" action="{% url 'users:logout' %}">{% csrf_token %}<button type="submit">Cerrar sesión</button></form>
      {% else %}
        <a href="{% url 'users:login' %}" {% if request.resolver_match.url_name == 'login' %}aria-current="page"{% endif %}>Iniciar sesión</a>
        <a href="{% url 'users:register' %}" {% if request.resolver_match.url_name == 'register' %}aria-current="page"{% endif %}>Registrarse</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in messages %}<div class="alert {{ message.tags }}" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('.password-toggle').forEach(button => {
      const input = document.getElementById(button.getAttribute('aria-controls'));
      button.hidden = false;
      button.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        button.setAttribute('aria-pressed', String(show));
        button.querySelector('.eye-slash').toggleAttribute('hidden', !show);
      });
    });

    document.querySelectorAll('.date-selects option[value=""]').forEach(option => {
      option.hidden = true;
      option.disabled = true;
    });

    // Conservamos el select de Django para enviar y validar la fecha.
    document.querySelectorAll('.date-selects select').forEach(select => {
      const wrapper = document.createElement('div');
      wrapper.className = 'date-picker';
      select.before(wrapper);
      wrapper.append(select);
      select.classList.add('date-native');
      select.tabIndex = -1;
      select.setAttribute('aria-hidden', 'true');

      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'date-trigger';
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      const label = select.options[0].textContent;
      const list = document.createElement('div');
      list.className = 'date-options';
      list.id = select.id + '_options';
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-label', label);
      list.hidden = true;
      trigger.setAttribute('aria-controls', list.id);
      wrapper.append(trigger, list);

      function refresh() {
        const selected = select.options[select.selectedIndex];
        trigger.textContent = selected ? selected.textContent : label;
        trigger.classList.toggle('placeholder', !select.value);
        trigger.setAttribute('aria-label', label + ': ' + trigger.textContent);
        list.querySelectorAll('[role="option"]').forEach(option => {
          option.setAttribute('aria-selected', String(option.dataset.value === select.value));
        });
      }
      function close() {
        list.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
      }
      function open(last = false) {
        list.hidden = false;
        trigger.setAttribute('aria-expanded', 'true');
        const options = list.querySelectorAll('[role="option"]');
        const selected = list.querySelector('[aria-selected="true"]');
        const target = selected || options[last ? options.length - 1 : 0];
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: 'nearest' });
      }
      Array.from(select.options).filter(option => option.value).forEach(option => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'date-option';
        item.tabIndex = -1;
        item.dataset.value = option.value;
        item.textContent = option.textContent;
        item.setAttribute('role', 'option');
        item.addEventListener('click', () => {
          select.value = option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
          close();
          trigger.focus();
        });
        list.append(item);
      });
      trigger.addEventListener('click', () => list.hidden ? open() : close());
      trigger.addEventListener('keydown', event => {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          open(event.key === 'ArrowUp');
        }
      });
      list.addEventListener('keydown', event => {
        const options = Array.from(list.children);
        const index = options.indexOf(document.activeElement);
        let next = index;
        if (event.key === 'ArrowDown') next = Math.min(index + 1, options.length - 1);
        else if (event.key === 'ArrowUp') next = Math.max(index - 1, 0);
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = options.length - 1;
        else if (event.key === 'Escape') { close(); trigger.focus(); }
        else return;
        event.preventDefault();
        if (!list.hidden) options[next].focus();
      });
      wrapper.addEventListener('focusout', event => {
        if (!wrapper.contains(event.relatedTarget)) close();
      });
      document.addEventListener('click', event => {
        if (!wrapper.contains(event.target)) close();
      });
      select.addEventListener('change', refresh);
      refresh();
    });

    // El maxlength lo genera Django; aquí solo mostramos el aviso al alcanzarlo.
    document.querySelectorAll('input[name="first_name"], input[name="last_name"]').forEach(input => {
      const notice = document.createElement('span');
      notice.id = input.id + '_limit';
      notice.className = 'helptext limit-notice';
      notice.setAttribute('aria-live', 'polite');
      input.closest('.field').querySelector('.field-feedback').append(notice);
      input.setAttribute('aria-describedby', [input.getAttribute('aria-describedby'), notice.id].filter(Boolean).join(' '));

      function updateNotice() {
        const valid = /^[\p{L} ]*$/u.test(input.value.normalize('NFC'));
        const error = 'Solo se permiten letras y espacios, incluidas tildes y ñ.';
        input.setCustomValidity(valid ? '' : error);
        notice.className = 'helptext limit-notice';
        notice.textContent = valid && input.value.length >= input.maxLength
          ? 'Alcanzaste el máximo de ' + input.maxLength + ' caracteres.'
          : '';
      }
      input.addEventListener('input', updateNotice);
      updateNotice();
    });

    // Mensajes bajo los campos en lugar de las ventanas nativas del navegador.
    document.querySelectorAll('main form').forEach(form => {
      form.noValidate = true;
      const fields = Array.from(form.querySelectorAll('.field'));

      function validate(field) {
        const controls = Array.from(field.querySelectorAll('input, select'));
        let message = '';
        if (controls.some(control => control.required && !control.value.trim())) {
          message = 'Este campo es obligatorio.';
        } else if (controls.some(control => control.validity.typeMismatch)) {
          message = 'Ingresa un correo electrónico válido.';
        } else if (controls.some(control => control.validity.customError)) {
          message = controls.find(control => control.validity.customError).validationMessage;
        } else if (controls.some(control => control.validity.tooLong)) {
          message = 'Superaste el máximo de caracteres permitido.';
        } else if (controls[0]?.name === 'password1' || controls[0]?.name === 'new_password1') {
          const value = controls[0].value;
          if (value.length < 8) message = 'La contraseña debe contener al menos 8 caracteres.';
          else if (/^\p{Nd}+$/u.test(value)) message = 'La contraseña no puede contener únicamente números.';
        } else if (controls[0]?.name === 'password2' || controls[0]?.name === 'new_password2') {
          const original = form.querySelector('[name="password1"], [name="new_password1"]');
          if (original && controls[0].value !== original.value) message = 'Las contraseñas no coinciden.';
        } else if (field.querySelector('.date-selects')) {
          const values = suffix => Number(field.querySelector('select[name$="_' + suffix + '"]').value);
          const year = values('year'), month = values('month'), day = values('day');
          const date = new Date(year, month - 1, day);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
            message = 'Selecciona una fecha válida.';
          } else if (date > today) message = 'La fecha de nacimiento no puede ser futura.';
        }

        let error = field.querySelector('.client-error');
        if (!error) {
          error = document.createElement('div');
          error.className = 'errorlist client-error';
          error.id = controls[0].id + '_client_error';
          error.setAttribute('aria-live', 'polite');
          field.append(error);
        }
        error.textContent = message;
        error.hidden = !message;
        field.querySelector('.field-feedback').classList.toggle('has-error', Boolean(message));
        const limitNotice = field.querySelector('.limit-notice');
        if (limitNotice) limitNotice.hidden = Boolean(message);
        controls.concat(Array.from(field.querySelectorAll('.date-trigger'))).forEach(control => {
          if (message) control.setAttribute('aria-invalid', 'true');
          else control.removeAttribute('aria-invalid');
          const describedBy = new Set((control.getAttribute('aria-describedby') || '').split(' ').filter(Boolean));
          describedBy.add(error.id);
          control.setAttribute('aria-describedby', Array.from(describedBy).join(' '));
        });
        return !message;
      }

      fields.forEach(field => {
        field.addEventListener('focusout', event => {
          if (!field.contains(event.relatedTarget)) {
            field.dataset.touched = 'true';
            validate(field);
          }
        });
        function update(event) {
          field.querySelectorAll('[id$="_error"]:not(.client-error)').forEach(error => error.hidden = true);
          if (field.dataset.touched || event.target.validity?.customError) validate(field);
          if (['password1', 'new_password1'].includes(event.target.name)) {
            fields.filter(item => item.dataset.touched && item.querySelector('[name="password2"], [name="new_password2"]')).forEach(validate);
          }
        }
        field.addEventListener('input', update);
        field.addEventListener('change', update);
      });
      form.addEventListener('submit', event => {
        const invalid = fields.filter(field => {
          field.dataset.touched = 'true';
          return !validate(field);
        });
        if (invalid.length) {
          event.preventDefault();
          invalid[0].querySelector('input:not(.date-native), .date-trigger').focus();
        }
      });
    });
  </script>
</body>
</html>
