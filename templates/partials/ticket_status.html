{% if ticket.is_checked_in %}<span class="badge badge-neutral">Utilizado</span>{% elif ticket.status == 'ISSUED' %}<span class="badge badge-success">{{ ticket.get_status_display }}</span>{% elif ticket.status == 'PENDING' %}<span class="badge badge-warning">{{ ticket.get_status_display }}</span>{% else %}<span class="badge badge-danger">{{ ticket.get_status_display }}</span>{% endif %}
