name: CI - Pruebas Automaticas Django

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalar dependencias (requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Verificar sintaxis y configuracion de Django
      env:
        SECRET_KEY: 'clave-temporal-para-ci-github-actions'
        DEBUG: 'True'
      run: |
        python manage.py check